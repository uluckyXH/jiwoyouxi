    <path d="M198 180q-22 15-28 43" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <!-- Closed smiling eyes, rather than the old half-lidded 3D expression. -->
    <path d="M218 224q11 12 22 0m55 0q11 12 22 0" fill="none" stroke-width="9"/>
    <ellipse cx="207" cy="250" rx="17" ry="10" fill="#EFB39A" stroke="none"/>
